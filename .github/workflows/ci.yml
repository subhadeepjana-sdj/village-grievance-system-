name: CI/CD Pipeline - AI Verification & Grievance Redressal

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-and-test:
    name: Backend CI (Python, NLI Engine, Verification Tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check backend/app --select=E,F,W --ignore=E501

      - name: Run Verification Unit Tests (Features 1-8)
        run: |
          python -m unittest discover -s backend/tests/verification -p "test_*.py" -v

      - name: Run End-to-End Regression Tests
        run: |
          python backend/tests/run_tests.py

  frontend-lint-and-build:
    name: Frontend CI (React, TypeScript, Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Type Check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build Production Frontend
        working-directory: frontend
        run: npm run build

  docker-build-check:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: village-grievance-backend:latest

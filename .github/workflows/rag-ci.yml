name: RAG Service CI

# Trigger on every push to main/develop and on PRs targeting main
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch to avoid queue build-up
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  #  Backend: lint + unit tests + docker build                          #
  # ------------------------------------------------------------------ #
  backend:
    name: Backend — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest ruff

      - name: Lint Python code with ruff
        working-directory: backend
        run: ruff check app/ --select=E,W,F --ignore=E501
        # E501: line too long — excluded; F-string formatting warnings are non-blocking

      - name: Run unit tests
        working-directory: backend
        env:
          # Provide dummy env vars so the app config doesn't raise on import
          DATABASE_URL: "sqlite:///./test_ci.db"
          QDRANT_HOST: "localhost"
          QDRANT_PORT: "6333"
          QDRANT_COLLECTION: "village_kb_ci"
          LLM_API_KEY: "ci-dummy-key"
          UPLOAD_DIR: "/tmp/uploads"
        run: python -m pytest tests/ -v --tb=short

      - name: Build Docker image (smoke test)
        run: docker build -t grievance-rag:ci-${{ github.sha }} backend/
        # Verifies the Dockerfile is valid; image is not pushed in CI

  # ------------------------------------------------------------------ #
  #  Frontend: install → lint → type-check → build                     #
  # ------------------------------------------------------------------ #
  frontend:
    name: Frontend — Node 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint with ESLint / Oxlint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production build
        working-directory: frontend
        run: npm run build
        # Build artefact is not uploaded — just validates the build succeeds

  # ------------------------------------------------------------------ #
  #  Optional: add PostgreSQL + Qdrant service containers here once     #
  #  the basic CI is stable. Example (commented out for now):          #

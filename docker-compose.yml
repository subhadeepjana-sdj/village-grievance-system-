version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: village_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: village_grievance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: village_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    container_name: village_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/village_grievance
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - JWT_SECRET=super-secret-key-for-village-grievance-system-2026
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant

  frontend:
    build: ./frontend
    container_name: village_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
